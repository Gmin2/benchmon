# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: benchmon
description: matches, rounds, players and cards of benchmon on monad testnet

contracts:
  - name: Duel
    abi_file_path: ./abis/Duel.json
    handler: ./src/handlers.ts
    events:
      - event: "Created(uint256 indexed id, address indexed a, uint256 stake)"
      - event: "Joined(uint256 indexed id, address indexed b, uint8 arena)"
      - event: "Revealed(uint256 indexed id, address indexed player, uint8 round, uint16 card)"
      - event: "RoundWon(uint256 indexed id, uint8 round, address winner, uint8 nextArena)"
      - event: "LiveDuel(uint256 indexed id, uint16 cardA, uint16 cardB, uint8 arena)"
      - event: "Verdict(uint256 indexed id, uint8 outcome, bytes32 duelHash, bool byJudge)"
      - event: "ArenaPicked(uint256 indexed id, uint8 round, uint8 arena, bool byTimeout)"
      - event: "Finished(uint256 indexed id, address winner, uint256 payout)"
      - event: "Cancelled(uint256 indexed id)"
  - name: CardStats
    abi_file_path: ./abis/CardStats.json
    handler: ./src/handlers.ts
    events:
      - event: "CardSet(uint256 indexed id, uint64 version, string name, uint8[6] stats)"
  - name: Backing
    abi_file_path: ./abis/Backing.json
    handler: ./src/handlers.ts
    events:
      - event: "Backed(uint256 indexed id, address indexed who, uint8 side, uint256 amount)"
  - name: MatchMarket
    abi_file_path: ./abis/MatchMarket.json
    handler: ./src/handlers.ts
    events:
      - event: "Traded(uint256 indexed id, address indexed who, uint8 side, int256 shares, int256 cost, uint256 priceA)"

chains:
  - id: 10143
    # CardStats went live at 66260790 and all 15 cards were set soon after,
    # so the chain starts there. the game contracts start at their own deploy blocks
    start_block: 66260790
    # no hypersync without an envio api token, so plain rpc and the getLogs range is the limit.
    # monad's public rpc serves 100 blocks a call at ~25 req/s, measured best of the free ones:
    # alchemy free serves 10 blocks and hits its CU/s cap (~30 blocks/s), thirdweb 429s at once,
    # drpc stalls under envio's parallel calls. envio reads range limits out of rpc errors itself.
    # with a token, set ENVIO_RPC_FOR=fallback and ENVIO_API_TOKEN to sync from hypersync
    rpc:
      - url: ${ENVIO_RPC_URL:-https://testnet-rpc.monad.xyz}
        for: ${ENVIO_RPC_FOR:-sync}
        initial_block_interval: 100
        interval_ceiling: 100
        backoff_multiplicative: 0.5
        backoff_millis: 1000
        query_timeout_millis: 15000
        polling_interval: 1000
      - url: ${ENVIO_FALLBACK_RPC_URL:-https://rpc-testnet.monadinfra.com}
        for: fallback
        initial_block_interval: 100
        interval_ceiling: 100
        backoff_millis: 1000
    contracts:
      - name: CardStats
        address: "0xD27730D0482746B1e0BD702429C2A9AB98d141Fb"
      - name: Duel
        address: "0xC110B9Ee0845Ed76D722Ccec3111302D56d1cA61"
        start_block: 66898566
      - name: Backing
        address: "0x966B8773B281589bFE3E83C7153a64B7E192a9F5"
        start_block: 66898573
      - name: MatchMarket
        address: "0x52CE235DCF1Afa5d4AF427BE9Df039c7797Fa35B"
        start_block: 66898576
